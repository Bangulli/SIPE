[build-system]
requires = [
  "setuptools>=77",
  "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "sipe"
version = "0.1.0"
description = "SIPE."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"

authors = [
  { name = "Lorenz Kuhn" },
  { name = "Valentin Oreiller" },
]

dependencies = [
  # General utilities
  "click>=8.5,<9",
  "pyyaml>=6,<7",
  "tqdm>=4.67,<5",
  # Scientific Python
  "numpy>=2.5,<3",
  "pandas>=3,<4",
  "scipy>=1.18,<2",
  "scikit-image>=0.26,<0.27",
  "scikit-learn>=1.8,<2",
  "matplotlib>=3.10,<4",
  "pillow>=12,<13",
  "opencv-python>=4.13,<5",
  # Deep learning
  "torch>=2.14,<2.15",
  "torchvision>=0.29,<0.30",
  "lightning>=2.6.6,<3",
  "timm>=1.0.29,<2",
  "transformers>=5.17,<6",
  # Metrics / losses
  "pytorch-msssim>=1,<2",
  "wandb>=0.30.0",
  "jsonargparse[signatures]>=4.27.7",
]


[project.optional-dependencies]
parquet = [
  "pyarrow>=20",
]


[dependency-groups]
dev = [
  "debugpy>=1.8",
  "ipykernel>=6",
  "pre-commit>=4",
  "pytest>=8",
  "ruff>=0.12",
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["sipe*"]


[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }


[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
]


[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
sipe = "sipe.cli:main"
