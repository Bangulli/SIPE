seed_everything: 42
matmul_precision: high  # TF32 for fp32 matmuls (A100); torch default is "highest"
trainer:
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  max_epochs: -1
  max_steps: 6000
  check_val_every_n_epoch: null
  val_check_interval: 100
  log_every_n_steps: 25
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: cats
      group: SCORPION
      job_type: dist-match-vae
      tags:
        - SCORPION
        - dist-match-vae
      save_dir: ./wandb
      log_model: false
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        # Only last.ckpt (overwritten at each validation): val/loss changes meaning
        # between curriculum phases, so "best" by val/loss is not meaningful.
        save_top_k: 0
        save_last: true
        save_weights_only: false
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: sipe.training.callbacks.ReconstructionLogger
      init_args:
        num_images: 4
        every_n_steps: 100
model:
  class_path: sipe.training.dist_match_vae_module.DistMatchVAEModule
  init_args:
    # Unpaired scanner removal (not legacy CATS; run with `sipe fit`): same network
    # as configs/paired_vae.yaml, trained with scanner labels only. Same-scanner swap
    # recon + KL + MMD and mean/covariance matching of standardized GAP(mu) across
    # scanners. No pairs, no adversary. Benchmarked representation: GAP(mu).
    # See dist_match_vae_module.py.
    network:
      class_path: sipe.model.paired_vae.PairedVAE
      init_args:
        encoder: h0-mini
        specified_dim: 64
        specified_hidden_dim: 256
        unspecified_hidden_dim: 1024
        reentangler_hidden_dim: 1024
        init_logvar: -4.0
        pixel_decoder: true # visualization only (trained on detached features)
        pretrained: true
        output_size: 224
    num_domains: 5
    lr: 3.0e-4 # cosine decay over trainer.max_steps
    weight_decay: 0.01
    kl_weight: 0.1 # as paired_vae / mathieu_gan
    kl_warmup_steps: 1000
    recon_weight: 1.0
    mmd_weight: 1.0
    mean_weight: 1.0
    cov_weight: 1.0
    match_warmup_steps: 1000
    mmd_bandwidths: [0.25, 0.5, 1.0, 2.0, 4.0] # x median squared distance
    pixel_weight: 1.0
    freeze_backbone: true
data:
  class_path: sipe.data.scorpion.UnpairedTrainSCORPIONDataModule
  init_args:
    data_root: data/processed/SCORPION_tiles_224px_0p5mpp
    batch_size: 512 # images (unpaired tiles), as paired_vae's 256 locations x 2
    val_views: null # validation: all 5 scanners per location, i.e. every val tile once
    val_batch_size: 100 # locations (500 images)
    num_workers: 8
    image_size: 224
    domain_column: scanner
    group_column: slide_id
    val_fraction: 0.1
    test_fraction: 0.1
    pin_memory: true
    persistent_workers: true
